<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Reading Nook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout concept: one full-bleed illustrated room (SVG world, 1200x720) seen through a camera that
   follows the character and pushes in on the shelf. HUD and dialogs are small paper-and-wood pieces
   laid over it. The room is a deliberate single look, warm lamplight on cream, sage and walnut. */
:root {
  --ink: #2b1c14;
  --paper: #f6ead2;
  --paper-2: #ecd9b4;
  --wood: #8a5a3b;
  --wood-dark: #4f321f;
  --amber: #f2a93b;
  --sage: #7d9a76;
  --rust: #b5572f;
  --night: #1f130c;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-spine: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
}
#app { position: relative; height: 100%; min-height: 480px; overflow: hidden; background: var(--night); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }

/* ambient light over the scene, in screen space */
.vignette { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 45%, rgba(255,190,100,0) 40%, rgba(40,18,6,.55) 100%),
    linear-gradient(180deg, rgba(255,170,70,.10), rgba(60,20,0,.10));
  mix-blend-mode: multiply; }

/* HUD */
.hud { position: absolute; inset: 0; pointer-events: none;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; justify-content: space-between; }
.hud > * { pointer-events: auto; }
.brand { align-self: flex-start; pointer-events: none; color: var(--paper); text-shadow: 0 1px 6px rgba(30,12,2,.7); }
.brand h1 { margin: 0; font: 400 clamp(20px, 3vw, 28px)/1.1 var(--font-display); letter-spacing: .01em; }
.brand p { margin: 3px 0 0; font-size: 13px; opacity: .9; }
.hud-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; pointer-events: none; }
.hud-bottom > * { pointer-events: auto; }
.keys { color: var(--paper); font-size: 12.5px; text-shadow: 0 1px 6px rgba(30,12,2,.8); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; text-align: right; }
@media (max-width: 640px) { .keys { display: none; } }
kbd { font: 700 11px var(--font-body); background: var(--paper); color: var(--ink); border-radius: 5px; padding: 2px 6px; box-shadow: 0 2px 0 var(--wood-dark); margin: 0 1px; }

.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 4px; }
.dpad button { border: 0; border-radius: 12px; background: rgba(246,234,210,.88); color: var(--wood-dark); font: 700 15px var(--font-body); cursor: pointer;
  box-shadow: 0 3px 0 var(--wood-dark), 0 6px 14px rgba(30,12,2,.35); touch-action: none; display: grid; place-items: center; }
.dpad button:active, .dpad button.on { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); background: var(--amber); }
.dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; } .dpad .act { grid-area: 2 / 2; background: var(--amber); } .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
.dpad svg { width: 18px; height: 18px; fill: currentColor; }
button:focus-visible, .cover-btn:focus-visible { outline: 3px solid #fff3c4; outline-offset: 2px; }

.prompt { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
  border: 0; border-radius: 999px; padding: 10px 18px; background: var(--paper); color: var(--ink); font: 600 14px var(--font-body);
  box-shadow: 0 3px 0 var(--wood-dark), 0 10px 24px rgba(30,12,2,.4); transition: opacity .25s, transform .25s; white-space: nowrap; max-width: calc(100% - 32px); }
.prompt.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; cursor: pointer; }
@media (max-width: 640px) { .prompt { bottom: calc(170px + env(safe-area-inset-bottom, 0px)); white-space: normal; text-align: center; width: max-content; } }

/* dialogs */
.layer { position: absolute; inset: 0; display: none; }
.layer.open { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(31,19,12,.72); backdrop-filter: blur(3px); animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }

.ask { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: min(340px, calc(100% - 32px));
  background: var(--paper); border-radius: 18px; padding: 22px 22px 20px; box-shadow: 0 0 0 6px var(--wood), 0 0 0 9px var(--wood-dark), 0 22px 40px rgba(20,8,0,.5); animation: rise .35s both;
  background-image: radial-gradient(rgba(138,90,59,.10) 1px, transparent 1.4px); background-size: 9px 9px; }
.ask::before, .ask::after { content: ""; position: absolute; top: -26px; width: 2px; height: 20px; background: var(--wood-dark); }
.ask::before { left: 30px; } .ask::after { right: 30px; }
.ask h2 { margin: 0 0 6px; font: 400 24px/1.15 var(--font-display); text-wrap: balance; }
.ask p { margin: 0 0 16px; color: #5a4636; font-size: 14px; }
.ask .row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 640px) { .ask { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: none; right: max(16px, env(safe-area-inset-right, 0px)); width: auto; } }

.btn { border: 0; border-radius: 12px; padding: 11px 16px; font: 700 14px var(--font-body); cursor: pointer; background: var(--paper-2); color: var(--ink); box-shadow: 0 3px 0 var(--wood-dark); transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
.btn.primary { background: var(--amber); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--paper); border: 2px solid rgba(246,234,210,.55); }

.panel { position: absolute; inset: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  margin: auto; max-width: 980px; max-height: 760px; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden;
  background: linear-gradient(180deg, #6b4630, #4f321f); box-shadow: 0 0 0 4px #2f1d11, 0 30px 60px rgba(0,0,0,.55); animation: rise .35s both; }
.panel header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; color: var(--paper); border-bottom: 3px solid rgba(0,0,0,.25); }
.panel header h2 { margin: 0; font: 400 clamp(20px, 3vw, 26px)/1.15 var(--font-display); }
.panel header p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
.shelfgrid { overflow: auto; padding: 22px 20px 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 26px 18px; align-content: start; }
.cover-btn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: var(--paper); text-align: center; min-width: 0; border-radius: 10px; }
.cover-btn:focus-visible { outline: 3px solid #fff3c4; outline-offset: 6px; }
.cover-btn .art { position: relative; aspect-ratio: 2 / 3; background: #e8d8b6; border-radius: 3px 8px 8px 3px; overflow: hidden; box-shadow: 0 10px 0 -2px rgba(0,0,0,.28), 0 16px 22px rgba(0,0,0,.45); transition: transform .2s; }
.cover-btn:hover .art, .cover-btn:focus-visible .art { transform: translateY(-8px) rotate(-1.5deg); }
.cover-btn svg, .bigcover svg, .bigcover img, .cover-btn img { display: block; width: 100%; height: 100%; }
.cover-btn img, .bigcover img, .thumb img { object-fit: contain; background: #e8d8b6; }
.cover-btn b { font: 400 14.5px/1.25 var(--font-display); overflow-wrap: anywhere; }
.cover-btn small { display: block; font-size: 12.5px; opacity: .78; margin-top: 2px; overflow-wrap: anywhere; }

.bookview { align-items: stretch; }
.bookbody { overflow: auto; flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 34px 56px; padding: 26px 24px 30px; }
.bigcover { position: relative; width: min(300px, 62vw); aspect-ratio: 2 / 3; background: #e8d8b6; border-radius: 4px 12px 12px 4px; overflow: hidden; flex: none;
  box-shadow: 0 14px 0 -3px rgba(0,0,0,.3), 0 30px 40px rgba(0,0,0,.55); transform: rotate(-2deg); animation: rise .5s .05s both; }
.meta { color: var(--paper); max-width: 360px; min-width: 0; text-align: left; }
.meta h3 { margin: 0 0 8px; font: 400 clamp(26px, 4vw, 38px)/1.1 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.meta .by { margin: 0 0 18px; font-size: 18px; opacity: .88; }
.meta .row { display: flex; gap: 10px; flex-wrap: wrap; }

.hdr-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.iconbtn { all: unset; box-sizing: border-box; flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--paper); border: 2px solid rgba(246,234,210,.5); }
.iconbtn:hover { background: rgba(246,234,210,.16); } .iconbtn:focus-visible { outline: 3px solid #fff3c4; outline-offset: 2px; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.countbar { padding: 10px 20px 0; color: var(--paper); font-size: 13px; opacity: .85; }
.toastwrap { padding: 0 20px; }
.toast { margin-top: 10px; padding: 10px 14px; background: var(--paper); color: var(--ink); border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 3px 0 var(--wood-dark); animation: rise .3s both; }
.panel footer { padding: 12px 20px; border-top: 3px solid rgba(0,0,0,.25); display: flex; }
.searchbar { display: flex; gap: 10px; padding: 16px 20px 6px; }
.searchbar input { flex: 1; min-width: 0; border: 0; border-radius: 12px; padding: 12px 14px; font: 600 16px var(--font-body); background: var(--paper); color: var(--ink); box-shadow: inset 0 2px 0 rgba(0,0,0,.14); }
.searchbar input:focus-visible { outline: 3px solid #fff3c4; outline-offset: 2px; }
.results { overflow: auto; flex: 1; padding: 10px 20px 20px; color: var(--paper); }
.results ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.result { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: rgba(0,0,0,.2); border-radius: 14px; padding: 10px; }
.thumb { aspect-ratio: 2 / 3; width: 64px; border-radius: 2px 6px 6px 2px; overflow: hidden; background: #e8d8b6; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.thumb img, .thumb svg { display: block; width: 100%; height: 100%; }
.rinfo { min-width: 0; } .rinfo b { display: block; font: 400 17px/1.25 var(--font-display); overflow-wrap: anywhere; }
.rinfo span { display: block; font-size: 13.5px; opacity: .88; overflow-wrap: anywhere; } .rinfo .rmeta { opacity: .7; font-size: 12.5px; margin-top: 2px; }
.badge { font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: rgba(246,234,210,.18); }
.msg { padding: 28px 8px; text-align: center; font-size: 15px; }
.msg p { margin: 0 0 14px; }
.facts { margin: 0 0 18px; display: grid; gap: 10px; }
.facts div { display: grid; gap: 1px; } .facts dt { font-size: 12.5px; opacity: .7; } .facts dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; } .dim { opacity: .6; }
.meta .note { margin: -6px 0 16px; font-size: 12.5px; opacity: .78; line-height: 1.4; }
.btn.danger { background: #e6b3a0; color: #4a1a0c; }
.confirm { background: rgba(0,0,0,.25); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.confirm p { margin: 0; font-size: 15px; }
.empty .btn { margin-top: 10px; }
@media (max-width: 520px) { .result { grid-template-columns: 56px minmax(0, 1fr); } .result .btn, .result .badge { grid-column: 1 / -1; justify-self: start; } .thumb { width: 56px; } }
.empty { color: var(--paper); padding: 40px 24px; text-align: center; grid-column: 1 / -1; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* welcome */
.welcome { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 5;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 70% 60% at 50% 48%, rgba(31,19,12,.50), rgba(31,19,12,.86) 100%);
  opacity: 0; transition: opacity .8s ease; color: #f6ead2; }
.welcome[hidden] { display: none; }
.welcome.in { opacity: 1; }
.welcome .inner { max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 20px; transform: translateY(10px); transition: transform 1s ease; }
.welcome.in .inner { transform: none; }
.welcome .orn { width: 64px; height: 1px; background: rgba(246,234,210,.55); position: relative; }
.welcome .orn::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; background: #f2a93b; transform: translate(-50%, -50%) rotate(45deg); }
.welcome h2 { margin: 0; font: 400 clamp(36px, 7vw, 68px)/1.05 var(--font-display); text-wrap: balance; text-shadow: 0 2px 18px rgba(20,8,0,.6); }
.welcome p { margin: 0; font: 400 clamp(17px, 2.4vw, 22px)/1.5 Georgia, "Times New Roman", serif; font-style: italic; max-width: 30ch; opacity: .94; text-shadow: 0 1px 10px rgba(20,8,0,.6); text-wrap: balance; }
.welcome .enter { margin-top: 10px; border: 0; border-radius: 999px; padding: 15px 34px; background: #f6ead2; color: var(--ink); font: 400 18px var(--font-display); cursor: pointer;
  box-shadow: 0 4px 0 var(--wood-dark), 0 14px 30px rgba(20,8,0,.5); transition: transform .15s, box-shadow .15s, background .2s; }
.welcome .enter:hover { background: #fff3d6; transform: translateY(-2px); box-shadow: 0 6px 0 var(--wood-dark), 0 18px 34px rgba(20,8,0,.5); }
.welcome .enter:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
.brand .again { pointer-events: auto; margin-top: 4px; padding: 0; border: 0; background: none; color: var(--paper); font: 600 12.5px var(--font-body); text-decoration: underline; text-underline-offset: 3px; opacity: .8; cursor: pointer; text-shadow: 0 1px 6px rgba(30,12,2,.7); }
.brand .again:hover { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .welcome, .welcome .inner { transition: none; } }

/* scene animation */
.spine-lift { transition: transform .18s; }
#scene.zoomed .spine { cursor: pointer; }
#scene.zoomed .spine:hover .spine-lift { transform: translateY(-7px); }
.bob { animation: bob 4s ease-in-out infinite; transform-box: fill-box; }
@keyframes bob { 50% { transform: translateY(-2px) rotate(3deg); } }
.blink { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.flame { animation: flicker 3.2s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { opacity: .9; } 40% { opacity: 1; } 60% { opacity: .82; } }
.cloud { animation: drift 70s linear infinite alternate; }
@keyframes drift { to { transform: translateX(140px); } }
.cat { animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: scale(1.025, 1.06); } }
.mote { animation: mote 14s ease-in-out infinite; }
@keyframes mote { 0%, 100% { transform: translate(0, 0); opacity: .0; } 20%, 80% { opacity: .75; } 50% { transform: translate(26px, -40px); } }
.flip { opacity: 0; transform-origin: 448px 490px; animation: flip 9s infinite; }
@keyframes flip { 0%, 78% { opacity: 0; transform: scaleX(1); } 80% { opacity: 1; transform: scaleX(1); } 91% { opacity: 1; transform: scaleX(-1); } 93%, 100% { opacity: 0; transform: scaleX(-1); } }
#scene.away .flip { animation: none; opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .bob, .blink, .flame, .cloud, .cat, .mote, .flip, .backdrop, .ask, .panel, .bigcover { animation: none !important; }
  .mote { opacity: .4; }
}
[hidden] { display: none !important; }
</style>

</head>
<body>
<div id="app">
  <svg id="scene" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A cozy reading room. A reader sits at a wooden table with a book and iced coffee. A bookshelf stands at the right holding every book you have read.">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d6ae"/><stop offset="1" stop-color="#dfc89d"/></linearGradient>
      <pattern id="paper" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M18 8l6 10-6 10-6-10z" fill="#b8955f" opacity=".12"/></pattern>
      <pattern id="planks" width="180" height="70" patternUnits="userSpaceOnUse">
        <rect width="180" height="70" fill="#a76d3f"/><rect y="0" width="90" height="35" fill="#b07745"/><rect x="90" y="35" width="90" height="35" fill="#b07745"/>
        <path d="M0 35H180M0 0H180M90 0V35M0 35V70M90 35V70M180 35V70" stroke="#6e4326" stroke-width="2" opacity=".55" fill="none"/>
        <path d="M10 12q30 -4 60 0M110 22q30 4 50 0M20 50q30 4 50 0M120 58q20 -4 50 0" stroke="#8c5733" stroke-width="1.5" fill="none" opacity=".5"/>
      </pattern>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b66b"/><stop offset=".6" stop-color="#f9d9a0"/><stop offset="1" stop-color="#fbeac4"/></linearGradient>
      <radialGradient id="sun"><stop offset="0" stop-color="#fffbe6"/><stop offset=".4" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd58a" stop-opacity=".42"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></linearGradient>
      <radialGradient id="lampglow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowfloor"><stop offset="0" stop-color="#ffd58a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>
      <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b88c"/><stop offset=".35" stop-color="#a9743f"/><stop offset="1" stop-color="#4a2a17"/></linearGradient>
      <linearGradient id="woodback" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2e1d"/><stop offset="1" stop-color="#5c3a24"/></linearGradient>
      <linearGradient id="woodframe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4d31"/><stop offset=".5" stop-color="#946040"/><stop offset="1" stop-color="#7a4d31"/></linearGradient>
      <linearGradient id="spineShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".18" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
      <clipPath id="winclip"><rect x="200" y="86" width="260" height="240" rx="6"/></clipPath>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    </defs>

    <g id="world">
      <!-- wall -->
      <rect x="-200" y="-400" width="1600" height="880" fill="url(#wall)"/>
      <rect x="-200" y="-400" width="1600" height="880" fill="url(#paper)"/>
      <!-- wainscot -->
      <rect x="-200" y="330" width="1600" height="150" fill="#6f8a67"/>
      <rect x="-200" y="324" width="1600" height="10" fill="#5a3a24"/>
      <rect x="-200" y="334" width="1600" height="4" fill="#000" opacity=".12"/>
      <g stroke="#9fb897" stroke-width="2" fill="none" opacity=".7">
        <rect x="20" y="352" width="140" height="104" rx="3"/><rect x="520" y="352" width="140" height="104" rx="3"/><rect x="670" y="352" width="140" height="104" rx="3"/>
        <rect x="170" y="352" width="1" height="0"/>
      </g>

      <!-- window -->
      <g>
        <rect x="190" y="76" width="280" height="260" rx="10" fill="#5a3a24"/>
        <rect x="200" y="86" width="260" height="240" rx="6" fill="url(#sky)"/>
        <g clip-path="url(#winclip)">
          <circle cx="360" cy="230" r="90" fill="url(#sun)"/>
          <circle cx="360" cy="232" r="22" fill="#fff6d2"/>

  const SPINE_COLORS = ['#7a4e8c', '#3f6b8c', '#9a5b3c', '#5b7a4a', '#a33f4a', '#c79a3b', '#4a5568', '#7b3f61'];

kKey": null, "editionKey": null, "coverUrl": "https://covers.openlibrary.org/b/isbn/9780857197689-L.jpg?default=false", "source": "starter", "verification": {"titleAuthorIsbn": "matched in retailer and library listings", "openLibrary": "not queried", "cover": "not fetched"}, "spine": {"color": "#2f5d45"}}, {"id": "the-alchemist", "title": "The Alchemist", "authors": ["Paulo Coelho"], "isbn": "9780062315007", "coverId": null, "firstPublishYear": null, "edition": null, "workKey": null, "editionKey": null, "coverUrl": "https://covers.openlibrary.org/b/isbn/9780062315007-L.jpg?default=false", "source": "starter", "verification": {"titleAuthorIsbn": "matched in retailer and library listings", "openLibrary": "not queried", "cover": "not fetched"}, "spine": {"color": "#b9622f"}}]};

  function render(zt) {
    const standing = char.mode === 'idle' || char.mode === 'walk';
    const riseP = char.mode === 'rise' ? clamp(char.t, 0, 1) : char.mode === 'sitdown' ? 1 - clamp(char.t, 0, 1) : (char.mode === 'sit' ? 0 : 1);
    const standOp = char.mode === 'sit' ? 0 : standing ? 1 : smooth((riseP - 0.25) / 0.45);
    const sitOp = char.mode === 'sit' ? 1 : standing ? 0 : 1 - smooth((riseP - 0.1) / 0.45);
    el.pStand.setAttribute('opacity', standOp.toFixed(2)); el.pSit.setAttribute('opacity', sitOp.toFixed(2));
    const depth = standing || char.mode === 'rise' ? 0.92 + 0.2 * clamp((char.y - FLOOR.y0) / (FLOOR.y1 - FLOOR.y0), 0, 1) : 1;
    const sc = char.mode === 'sit' ? 1 : lerp(1, depth, smooth(riseP));
    const face = char.mode === 'sit' || char.mode === 'sitdown' ? 1 : char.face;
    el.char.setAttribute('transform', `translate(${char.x.toFixed(1)},${char.y.toFixed(1)}) scale(${(sc * face).toFixed(3)},${sc.toFixed(3)})`);
    // see-through when standing in front of the zoomed shelf
    const over = standing && char.x > SHELF.x0 + 10 ? zt : 0;
    el.char.setAttribute('opacity', lerp(1, 0.55, over).toFixed(2));
    el.scene.classList.toggle('away', char.mode !== 'sit');

    // walk cycle
    if (standing) {
      const w = char.mode === 'walk'; const s = w ? Math.sin(char.phase) : 0;
      const bob = w ? Math.abs(Math.cos(char.phase)) * -3 : Math.sin(time * 2) * 0.6;
      el.legL.setAttribute('transform', `rotate(${(s * 30).toFixed(1)})`); el.legR.setAttribute('transform', `rotate(${(-s * 30).toFixed(1)})`);
      el.armL.setAttribute('transform', `rotate(${(-s * 26).toFixed(1)})`); el.armR.setAttribute('transform', `rotate(${(s * 26).toFixed(1)})`);
      el.pStand.setAttribute('transform', `translate(0,${bob.toFixed(2)})`);
    } else {
      el.pStand.setAttribute('transform', 'translate(0,0)');
      el.legL.setAttribute('transform', 'rotate(0)'); el.legR.setAttribute('transform', 'rotate(0)');
    }
    // seated breathing
    el.sitBody.setAttribute('transform', `translate(0,${(Math.sin(time * 1.8) * 0.8).toFixed(2)})`);
    el.headSit.setAttribute('transform', `translate(-16,${(-158 + Math.sin(time * 1.8) * 0.8).toFixed(2)}) rotate(${(10 + Math.sin(time * 0.7) * 1.5).toFixed(1)})`);
  }

  /* ---------- Prompt pill ---------- */
  let promptKey = '';
  function updatePrompt() {
    let text = '', key = '';
    const E = coarse ? '' : '<kbd>E</kbd> ';
    if (dialog !== 'none') key = '';
    else if (char.mode === 'sit' && !target) { key = 'stand'; text = coarse ? 'Use the arrows to stand up and walk' : 'Press <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or an arrow key to stand up'; }
    else if (inZone()) { key = 'shelf'; text = coarse ? 'Tap to explore your bookshelf' : 'Press <kbd>E</kbd> to explore your bookshelf'; }
    else if (nearChair()) { key = 'chair'; text = `${E}${coarse ? 'Tap to sit' : 'Sit'} back down and read`; }
    if (key !== promptKey) {
      promptKey = key; const p = $('#prompt');
      if (key) p.innerHTML = text;
      p.classList.toggle('show', !!key);
      p.tabIndex = key ? 0 : -1;
      if (key === 'stand') p.style.pointerEvents = 'none'; else p.style.pointerEvents = '';
    }
  }

  function interact() {
    if (dialog !== 'none') return;
    if (inZone()) { openLibrary(); return; }
    if (nearChair()) { char.mode = 'sitdown'; char.t = 0; char.from = { x: char.x, y: char.y }; target = null; }
  }

  /* ---------- Dialogs ---------- */
  const layer = $('#layer'); let returnFocus = null; let cameFrom = 'room';
  function show(html, focusSel) {
    if (dialog === 'none') returnFocus = document.activeElement;
    layer.innerHTML = html; layer.classList.add('open');
    wireCoverFallback(layer, lookup);
    const f = layer.querySelector(focusSel || 'button'); if (f) f.focus({ preventScroll: true });
    keys.clear(); pad.clear(); target = null;
  }
  function close() {
    dialog = 'none'; layer.classList.remove('open'); layer.innerHTML = '';
    if (returnFocus && returnFocus.focus && document.contains(returnFocus)) returnFocus.focus({ preventScroll: true });
    dwell = 0;
  }
  /* ---------- Library, book view, add a book ---------- */
  const ui = { toast: '', results: [], query: '', status: 'idle', current: null, review: null, confirming: false, ctl: null };
  const lookup = (id) => getBook(id) || ui.results.find((r) => r.id === id) || null;
  const ICON_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const plural = (n) => `${n} ${n === 1 ? 'book' : 'books'}`;

  function back() {
    if (dialog === 'book') { if (ui.confirming) { ui.confirming = false; openBook(ui.current); } else openLibrary(); }
    else if (dialog === 'review') openAdd();
    else if (dialog === 'add') openLibrary();
    else close();
  }
  function trapTab(e) {
    const f = [...layer.querySelectorAll('button, input, [href], [tabindex]:not([tabindex="-1"])')].filter((n) => !n.disabled && n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], lastEl = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
    else if (!layer.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }

  function openLibrary() {
    dialog = 'library'; ui.confirming = false;
    const n = books.length;
    const grid = n ? books.map((b) => `<button class="cover-btn" data-book="${esc(b.id)}" aria-label="${esc(b.title)} by ${esc(b.author || 'unknown author')}"><span class="art">${coverHTML(b)}</span><span class="cap"><b>${esc(b.title)}</b><small>${esc(b.author || 'Author not listed')}</small></span></button>`).join('')
      : '<div class="empty"><p>Your shelf is empty.</p><button class="btn primary" data-act="add">Add your first book</button></div>';
    const toast = ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : ''; ui.toast = '';
    show(`<div class="backdrop" data-act="close"></div><section class="panel library" role="dialog" aria-modal="true" aria-labelledby="libT" aria-describedby="libD">
      <header><div><h2 id="libT">Your Little Library</h2><p id="libD">Every book on this shelf is part of your reading journey.</p></div>
        <div class="hdr-actions"><button class="btn primary" data-act="add">Add a Book</button><button class="iconbtn" data-act="close" aria-label="Close the library and return to the room">${ICON_X}</button></div></header>
      <div class="countbar" id="libCount">${plural(n)} in your library</div>
      <div class="toastwrap" role="status" aria-live="polite">${toast}</div>
      <div class="shelfgrid">${grid}</div>
      <footer><button class="btn ghost" data-act="close">Back to the room</button></footer></section>`, n ? '.cover-btn' : '[data-act="add"]');
    if (toast) setTimeout(() => { const t = layer.querySelector('.toast'); if (t) t.remove(); }, 6000);
    $('#live').textContent = `Your Little Library. ${plural(n)}.`;
  }

  const fact = (label, value) => `<div><dt>${esc(label)}</dt><dd>${value}</dd></div>`;
  const NOT_REC = '<span class="dim">Not recorded</span>';
  function openBook(id) {
    const b = getBook(id); if (!b) { openLibrary(); return; }
    ui.current = id; dialog = 'book';
    const facts = fact('ISBN', b.isbn ? esc(b.isbn) : NOT_REC)
      + fact('First published (the work)', b.firstPublishYear ? esc(b.firstPublishYear) : NOT_REC)
      + fact('This edition published', b.editionYear ? esc(b.editionYear) : NOT_REC)
      + (b.edition ? fact('Edition', esc(b.edition)) : '');
    const unconfirmed = b.verification && b.verification.openLibrary === 'not queried' ? '<p class="note">Title, author and ISBN were matched in retailer and library listings. Open Library has not confirmed this record, so the year details are blank.</p>' : '';
    const actions = ui.confirming
      ? `<div class="confirm" role="alertdialog" aria-labelledby="cfT"><p id="cfT">Remove “${esc(b.title)}” from your library? It will leave the shelf too.</p><div class="row"><button class="btn danger" data-act="remove-yes">Yes, remove it</button><button class="btn primary" data-act="remove-no">Keep it</button></div></div>`
      : `<div class="row"><button class="btn primary" data-act="library">Back to the library</button><button class="btn" data-act="remove">Remove from my library</button></div>`;
    show(`<div class="backdrop" data-act="library"></div><section class="panel bookview" role="dialog" aria-modal="true" aria-labelledby="bkT"><header><div></div><button class="iconbtn" data-act="close" aria-label="Close the library and return to the room">${ICON_X}</button></header>
      <div class="bookbody"><div class="bigcover">${coverHTML(b)}</div><div class="meta"><h3 id="bkT">${esc(b.title)}</h3><p class="by">${esc(b.author || 'Author not listed')}</p>
      <dl class="facts">${facts}</dl>${unconfirmed}${actions}</div></div></section>`, ui.confirming ? '[data-act="remove-no"]' : '[data-act="library"]');
    $('#live').textContent = `${b.title} by ${b.author || 'unknown author'}`;
  }
  function removeCurrent() {
    const b = getBook(ui.current); if (!b) { openLibrary(); return; }
    books = books.filter((x) => x.id !== b.id); // strict id match: similar titles are never touched
    saveLibrary(); renderShelf();
    ui.toast = `“${b.title}” was removed from your library.`; ui.confirming = false; openLibrary();
  }

  /* ----- Add a book: Open Library search, explicit choice, review, then save ----- */
  function docToBook(d) {
    const key = d.key || null; const isbns = Array.isArray(d.isbn) ? d.isbn : [];
    const isbn = isbns.find((i) => /^97[89]\d{10}$/.test(i)) || isbns.find((i) => /^\d{9}[\dX]$/.test(i)) || null;
    const authors = Array.isArray(d.author_name) ? d.author_name.filter(Boolean) : [];
    const id = key ? 'ol-' + key.split('/').pop().toLowerCase() : isbn ? 'isbn-' + isbn : 'title-' + hash(d.title + authors.join('|')).toString(36);
    return normalize({ id, title: d.title, authors, isbn, coverId: d.cover_i || null, firstPublishYear: d.first_publish_year || null, edition: null, editionKey: null, workKey: key,
      coverUrl: d.cover_i ? OL_COVER(d.cover_i, 'M') : null, source: 'open-library-search' });
  }
  async function searchOpenLibrary(q) {
    if (ui.ctl) ui.ctl.abort();
    const ctl = ui.ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 12000);
    try {
      const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=key,title,author_name,cover_i,first_publish_year,isbn&limit=12`;
      const res = await fetch(url, { signal: ctl.signal }); if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      return (data.docs || []).filter((d) => d && typeof d.title === 'string' && d.title).map(docToBook);
    } finally { clearTimeout(timer); }
  }
  async function runSearch(q) {
    q = q.trim(); if (!q) return;
    ui.query = q; ui.status = 'loading'; renderResults();
    const mine = ++searchSeq;
    try { const r = await searchOpenLibrary(q); if (mine !== searchSeq) return; ui.results = r; ui.status = r.length ? 'done' : 'empty'; }
    catch (_) { if (mine !== searchSeq) return; ui.results = []; ui.status = 'error'; }
    renderResults();
  }
  let searchSeq = 0;

  function renderResults() {
    const box = layer.querySelector('#results'); if (!box) return;
    let h = '';
    if (ui.status === 'idle') h = '<p class="msg">Search by title or author. Matches come from Open Library, and nothing is added until you choose it.</p>';
    else if (ui.status === 'loading') h = '<p class="msg">Searching Open Library…</p>';
    else if (ui.status === 'error') h = '<div class="msg"><p>Could not reach Open Library, so there are no results to show. Check your connection and try again. Your library has not changed.</p><button class="btn" data-act="retry">Try again</button></div>';
    else if (ui.status === 'empty') h = `<p class="msg">No books found for “${esc(ui.query)}”. Check the spelling, or try the author’s name instead.</p>`;
    else h = '<ul>' + ui.results.map((r, i) => {
      const dup = findDuplicate(r);
      const ident = r.isbn ? `ISBN ${esc(r.isbn)}` : r.workKey ? `Open Library ${esc(r.workKey.split('/').pop())}` : 'No identifier listed';
      return `<li class="result"><span class="thumb">${coverHTML(r)}</span><span class="rinfo"><b>${esc(r.title)}</b><span>${esc(r.author || 'Author not listed')}</span><span class="rmeta">First published ${r.firstPublishYear ? esc(r.firstPublishYear) : 'year not listed'} · ${ident}</span></span>
        ${dup ? '<span class="badge">Already in your library</span>' : `<button class="btn" data-pick="${i}" aria-label="Review ${esc(r.title)} by ${esc(r.author || 'unknown author')}">Choose</button>`}</li>`;
    }).join('') + '</ul>';
    box.innerHTML = h; wireCoverFallback(box, lookup);
  }

  function openAdd() {
    dialog = 'add';
    show(`<div class="backdrop" data-act="library"></div><section class="panel addview" role="dialog" aria-modal="true" aria-labelledby="adT">
      <header><div><h2 id="adT">Add a Book</h2><p>Search by title or author, then choose the book you mean.</p></div><button class="iconbtn" data-act="close" aria-label="Close the library and return to the room">${ICON_X}</button></header>
      <form class="searchbar" id="searchForm" role="search"><label class="sr" for="q">Search by title or author</label><input id="q" name="q" type="search" autocomplete="off" placeholder="Title or author" value="${esc(ui.query)}"><button class="btn primary" type="submit">Search</button></form>
      <div class="results" id="results" aria-live="polite"></div>
      <footer><button class="btn ghost" data-act="library">Back to the library</button></footer></section>`, '#q');
    renderResults();
  }

  function openReview(i) {
    const r = ui.results[i]; if (!r) return;
    ui.review = r; dialog = 'review';
    const dup = findDuplicate(r);
    const warn = [];
    if (!r.authors.length) warn.push('The catalogue lists no author for this result.');
    if (!r.coverSources.length) warn.push('The catalogue has no cover for this result.');
    if (!r.firstPublishYear) warn.push('No first publication year is listed.');
    show(`<div class="backdrop" data-act="results"></div><section class="panel bookview" role="dialog" aria-modal="true" aria-labelledby="rvT"><header><div><h2 id="rvT">Is this the book you mean?</h2></div><button class="iconbtn" data-act="close" aria-label="Close the library and return to the room">${ICON_X}</button></header>
      <div class="bookbody"><div class="bigcover">${coverHTML(r)}</div><div class="meta"><h3>${esc(r.title)}</h3><p class="by">${esc(r.author || 'Author not listed')}</p>
      <dl class="facts">${fact('ISBN', r.isbn ? esc(r.isbn) : NOT_REC)}${fact('Open Library work', r.workKey ? esc(r.workKey) : NOT_REC)}${fact('First published (the work)', r.firstPublishYear ? esc(r.firstPublishYear) : NOT_REC)}</dl>
      ${r.isbn ? '<p class="note">The ISBN is one the catalogue lists for this work. It may belong to a different edition from the cover shown.</p>' : ''}
      ${warn.length ? `<p class="note">${esc(warn.join(' '))}</p>` : ''}
      ${dup ? `<p class="note">This matches “${esc(dup.title)}”, which is already in your library.</p>` : ''}
      <div class="row">${dup ? '' : '<button class="btn primary" data-act="confirm-add">Add to my library</button>'}<button class="btn" data-act="results">Back to results</button></div></div></div></section>`, dup ? '[data-act="results"]' : '[data-act="confirm-add"]');
  }
  function confirmAdd() {
    const r = ui.review; if (!r) return;
    if (findDuplicate(r)) { openAdd(); return; }
    const rec = toRecord(r);
    rec.coverUrl = rec.coverId ? OL_COVER(rec.coverId) : (rec.isbn ? OL_ISBN(rec.isbn) : null);
    rec.addedAt = Date.now();
    rec.verification = { titleAuthorIsbn: 'as returned by the Open Library search result the reader chose', openLibrary: 'search result selected by the reader', cover: rec.coverId ? 'cover ID from the same search result' : 'looked up by ISBN' };
    const nb = normalize(rec); books = books.concat([nb]);
    saveLibrary(); renderShelf(); tintSpine(nb);
    ui.toast = `“${nb.title}” was added to your library.`; ui.review = null; openLibrary();
  }

  layer.addEventListener('submit', (e) => { e.preventDefault(); const q = layer.querySelector('#q'); if (q) runSearch(q.value); });
  layer.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act], [data-book], [data-pick]'); if (!t) return;
    if (t.dataset.book) { openBook(t.dataset.book); return; }
    if (t.dataset.pick !== undefined) { openReview(+t.dataset.pick); return; }
    switch (t.dataset.act) {
      case 'close': close(); break;
      case 'library': openLibrary(); break;
      case 'add': openAdd(); break;
      case 'results': openAdd(); break;
      case 'retry': runSearch(ui.query); break;
      case 'remove': ui.confirming = true; openBook(ui.current); break;
      case 'remove-no': ui.confirming = false; openBook(ui.current); break;
      case 'remove-yes': removeCurrent(); break;
      case 'confirm-add': confirmAdd(); break;
    }
  });

  /* ---------- Welcome ----------
     The room keeps running behind the overlay; only input is paused (dialog === 'welcome').
     The first-visit choice is remembered in localStorage, which can be unavailable, so every access is guarded. */
  const WELCOME_KEY = 'readingNook.welcomed';
  const seen = { get() { try { return localStorage.getItem(WELCOME_KEY) === '1'; } catch (_) { return false; } }, set() { try { localStorage.setItem(WELCOME_KEY, '1'); } catch (_) {} } };
  const welcomeEl = $('#welcome');
  let welcomeTimer = 0;
  function openWelcome() {
    if (dialog !== 'none') return;
    clearTimeout(welcomeTimer);
    dialog = 'welcome'; returnFocus = document.activeElement;
    keys.clear(); pad.clear(); target = null;
    welcomeEl.hidden = false; void welcomeEl.offsetWidth; welcomeEl.classList.add('in');
    $('#enterBtn').focus({ preventScroll: true });
  }
  function enterNook() {
    if (dialog !== 'welcome') return;
    seen.set(); dialog = 'none'; dwell = 0;
    welcomeEl.classList.remove('in');
    welcomeTimer = setTimeout(() => { welcomeEl.hidden = true; }, reduceMotion ? 0 : 850);
    if (returnFocus && returnFocus.focus && document.contains(returnFocus) && returnFocus !== document.body) returnFocus.focus({ preventScroll: true });
    else if (document.activeElement) document.activeElement.blur();
  }
  $('#enterBtn').addEventListener('click', enterNook);
  $('#againBtn').addEventListener('click', openWelcome);

  /* ---------- Clock on the wall ---------- */
  function tick() {
    const d = new Date(); const m = d.getMinutes() + d.getSeconds() / 60, h = (d.getHours() % 12) + m / 60;
    $('#minHand').setAttribute('transform', `rotate(${m * 6} 722 150)`); $('#hourHand').setAttribute('transform', `rotate(${h * 30} 722 150)`);
  }
  tick(); setInterval(tick, 5000);

  /* ---------- Public API: connect a real account here later ---------- */
  window.ReadingNook = {
    get books() { return books.map(toRecord); },
    setBooks(list) { books = (Array.isArray(list) ? list.filter(validBook) : []).map(normalize); saveLibrary(); renderShelf(); books.forEach(tintSpine); },
    addBook(b) { if (!validBook(b)) return false; const nb = normalize(b); if (findDuplicate(nb)) return false; books = books.concat([nb]); saveLibrary(); renderShelf(); tintSpine(nb); return true; },
    removeBook(id) { const n = books.length; books = books.filter((b) => b.id !== id); if (books.length !== n) { saveLibrary(); renderShelf(); return true; } return false; },
  };

  /* ---------- Start ---------- */
  initLibrary();
  render(0); updateCamera(0, true); updatePrompt();
  if (!seen.get()) openWelcome();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((n) => { last = n; frame(n); });
})();
</script>
</body>
</html>
